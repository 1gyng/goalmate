<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>목표 목록 | Goal Mate</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="drawer-container" class="drawer drawer-end">
    <input id="my-drawer" type="checkbox" class="drawer-toggle" />
    
    <div class="drawer-content flex flex-col p-6 transition-all duration-300">
        <div class="flex justify-end">
            <button onclick="toggleDrawer()" class="btn btn-ghost btn-circle">
                <span id="btn-icon">➡️</span>
            </button>
        </div>
        
        <div class="flex-1 border-2 border-dashed border-base-300 rounded-3xl flex items-center justify-center">
            <span class="text-xl font-bold opacity-20">캘린더 영역 (W-FULL)</span>
        </div>
    </div> 

    <div class="drawer-side border-l border-base-300">
        <label for="my-drawer" class="drawer-overlay"></label> 
        <div class="p-4 w-96 min-h-full flex flex-col h-screen gap-y-3">
            <div class="flex justify-start">
                <button class="btn btn-circle btn-ghost" onclick="toggleDrawer()">
                    <i data-lucide="chevrons-right" class="w-8 h-8"></i>
                </button>
            </div>

            <div class="card bg-base-100 shadow-sm border border-base-200">
                <div class="card-body">
                    <h2 class="card-title text-md font-bold">
                        <span class="text-2xl">🎯</span> 목표 내용
                    </h2>
                    <div class="join w-full" id="result-radio-div">
                        <input type="radio" class="btn join-item flex-1" name="result" aria-label="달성" value="SUCCESS" />
                        <input type="radio" class="btn join-item flex-1" name="result" aria-label="미달성" value="FAILED" />
                    </div>
                </div>
            </div>
                
            <div class="p-4 border border-dashed border-base-300 rounded-box flex-1 overflow-y-auto">
                <h2 class="text-2xl font-black mb-8">오늘의 기록</h2>
                <p class="opacity-50">내용이 들어갈 자리</p>
            </div>
        </div>
    </div>
</div>
<script>
    lucide.createIcons();

    function toggleDrawer() {
        const container = document.getElementById('drawer-container');
        container.classList.toggle('drawer-open');
    }

    document.querySelectorAll('#result-radio-div input[type="radio"]').forEach(radio => {
        radio.addEventListener('change', async (e) => {
            const goalId = '';
            const savedResult = '';
            const result = e.target.value;

            if (savedResult === result) {
                return;
            }

            const updateResultData = {
                result: result
            };

            try {
                const response = await fetch(`/goals/${goalId}/result`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updateResultData)
                });
                const data = await response.json();

                if(!response.ok) {
                    throw new Error(data.message);
                }

                alert(data.message);
            }
            catch(error) {
                alert(error.message);
            }
        });
    });
</script>
</body>
</html>
