<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head-config('오늘의 목표 | goalmate', ~{ :: today-goal-head})}">
    <th:block th:fragment="today-goal-head">
        <link th:href="@{/css/today-goal.css}" href="../css/today-goal.css" rel="stylesheet">
    </th:block>
</head>

<body>
    <div class="flex flex-col h-screen">
        <header th:replace="~{fragments/nav :: topNav}"></header>

        <div class="flex flex-1 overflow-hidden">
            <aside th:replace="~{fragments/nav :: leftNav}"></aside>

            <div id="drawer-container" class="drawer drawer-end">
                <input id="goal-list-drawer" type="checkbox" class="drawer-toggle" />

                <div class="drawer-content flex flex-col p-6 transition-all duration-300">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 p-6">
                        <div class="card bg-base-100 shadow-xl border border-base-200">
                            <div class="card-body p-6">
                                <div class="flex justify-between items-center">
                                    <div class="flex items-center">
                                        <h2 class="card-title text-lg min-w-[100px]">📅 Daily</h2>
                                        <button class="btn btn-link no-underline p-0 text-gray-500 goal-list-btn"
                                            data-type="DAILY">전체보기</button>
                                    </div>
                                    <span class="badge badge-ghost badge-sm" th:text="${dailyGoals.startDate}"></span>
                                </div>
                                <div>
                                    <ul class="menu w-full bg-base-200 rounded-box gap-1">
                                        <li th:if="${#lists.isEmpty(dailyGoals.items)}">등록된 일간 목표가 없어요!</li>
                                        <li th:unless="${#lists.isEmpty(dailyGoals.items)}"
                                            th:each="goal : ${dailyGoals.items}">
                                            <button type="button" class="goal-item-btn justify-start font-normal"
                                                th:data-id="${goal.id}" th:data-task="${goal.task}"
                                                th:data-result="${goal.result}">
                                                <span th:text="${goal.task}">목표 제목</span>
                                            </button>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <div class="card bg-base-100 shadow-xl border border-base-200">
                            <div class="card-body p-6">
                                <div class="flex justify-between items-center">
                                    <div class="flex items-center">
                                        <h2 class="card-title text-accent text-lg min-w-[100px]">🗓️ Weekly</h2>
                                        <button class="btn btn-link no-underline p-0 text-gray-500 goal-list-btn"
                                            data-type="WEEKLY">전체보기</button>
                                    </div>
                                    <span class="badge badge-ghost badge-sm"
                                        th:text="|${weeklyGoals.startDate} ~ ${weeklyGoals.dueDate}|"></span>
                                </div>

                                <div>
                                    <ul class="menu w-full bg-base-200 rounded-box gap-1">
                                        <li th:if="${#lists.isEmpty(weeklyGoals.items)}">등록된 주간 목표가 없어요!</li>
                                        <li th:unless="${#lists.isEmpty(weeklyGoals.items)}"
                                            th:each="goal : ${weeklyGoals.items}">
                                            <button type="button" class="goal-item-btn justify-start font-normal"
                                                th:data-id="${goal.id}" th:data-task="${goal.task}"
                                                th:data-result="${goal.result}">
                                                <span th:text="${goal.task}">목표 제목</span>
                                            </button>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <div class="card bg-base-100 shadow-xl border border-base-200">
                            <div class="card-body p-6">
                                <div class="flex justify-between items-center">
                                    <div class="flex items-center">
                                        <h2 class="card-title text-accent text-lg min-w-[100px]">🚀 Monthly</h2>
                                        <button class="btn btn-link no-underline p-0 text-gray-500 goal-list-btn"
                                            data-type="MONTHLY">전체보기</button>
                                    </div>
                                    <span class="badge badge-ghost badge-sm"
                                        th:text="|${monthlyGoals.startDate} ~ ${monthlyGoals.dueDate}|"></span>
                                </div>

                                <div>
                                    <ul class="menu w-full bg-base-200 rounded-box gap-1">
                                        <li th:if="${#lists.isEmpty(monthlyGoals.items)}">등록된 월간 목표가 없어요!</li>
                                        <li th:unless="${#lists.isEmpty(monthlyGoals.items)}"
                                            th:each="goal : ${monthlyGoals.items}">
                                            <button type="button" class="goal-item-btn justify-start font-normal"
                                                th:data-id="${goal.id}" th:data-task="${goal.task}"
                                                th:data-result="${goal.result}">
                                                <span th:text="${goal.task}">목표 제목</span>
                                            </button>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <div class="card bg-base-100 shadow-xl border border-base-200">
                            <div class="card-body p-6">
                                <div class="flex justify-between items-center">
                                    <div class="flex items-center">
                                        <h2 class="card-title text-accent text-lg min-w-[100px]">🏆 Yearly</h2>
                                        <button class="btn btn-link no-underline p-0 text-gray-500 goal-list-btn"
                                            data-type="YEARLY">전체보기</button>
                                    </div>
                                    <span class="badge badge-ghost badge-sm"
                                        th:text="|${yearlyGoals.startDate} ~ ${yearlyGoals.dueDate}|"></span>
                                </div>

                                <div>
                                    <ul class="menu w-full bg-base-200 rounded-box gap-1">
                                        <li th:if="${#lists.isEmpty(yearlyGoals.items)}">등록된 연간 목표가 없어요!</li>
                                        <li th:unless="${#lists.isEmpty(yearlyGoals.items)}"
                                            th:each="goal : ${yearlyGoals.items}">
                                            <button type="button" class="goal-item-btn justify-start font-normal"
                                                th:data-id="${goal.id}" th:data-task="${goal.task}"
                                                th:data-result="${goal.result}">
                                                <span th:text="${goal.task}">목표 제목</span>
                                            </button>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="drawer-side border-l border-base-300">
                    <label for="goal-list-drawer" class="drawer-overlay"></label>
                    <aside class="p-4 w-[55vh] h-screen flex flex-col gap-y-2">
                        <div class="flex justify-start shrink-0">
                            <label for="goal-list-drawer" class="btn btn-circle btn-ghost">
                                <i data-lucide="chevrons-right" class="w-8 h-8"></i>
                            </label>
                        </div>

                        <div class="card bg-base-100 shadow-sm border border-base-200">
                            <div class="card-body h-[55vh] flex flex-col">
                                <div id="goal-filter-container" class="flex justify-end gap-x-1">
                                    <input type="radio" name="goalResultFilter"
                                        class="btn btn-sm btn-ghost rounded-full" aria-label="전체" value="ALL" checked />
                                    <input type="radio" name="goalResultFilter"
                                        class="btn btn-sm btn-ghost rounded-full" aria-label="달성" value="SUCCESS" />
                                    <input type="radio" name="goalResultFilter"
                                        class="btn btn-sm btn-ghost rounded-full" aria-label="미달성" value="FAILED" />
                                    <input type="radio" name="goalResultFilter"
                                        class="btn btn-sm btn-ghost rounded-full" aria-label="미선택" value="NONE" />
                                </div>
                                <div class="overflow-y-auto [scrollbar-gutter:stable] flex-1">
                                    <ul id="goal-list-container" class="list bg-base-100 rounded-box p-2">

                                    </ul>
                                </div>
                                <div id="more-btn-container" class="card-actions hidden shadow-sm flex-none">
                                    <button id="goal-more-btn" class="btn w-full">더보기</button>
                                </div>
                            </div>
                        </div>

                        <div id="drawer-result" class="card bg-base-100 shadow-sm border border-base-200 hidden">
                            <div class="card-body gap-y-2">
                                <h2 class="card-title">
                                    <i data-lucide="goal"></i>
                                    <span id="drawer-goal-task" class="text-sm font-bold"></span>
                                </h2>
                                <label class="input input-sm">
                                    <span class="label">목표 완료일</span>
                                    <input type="date" />
                                </label>
                                <div class="join w-full" id="result-radio-div">
                                    <input type="radio" class="btn join-item flex-1" name="result" aria-label="달성"
                                        value="SUCCESS" />
                                    <input type="radio" class="btn join-item flex-1" name="result" aria-label="미달성"
                                        value="FAILED" />
                                </div>
                            </div>
                        </div>
                    </aside>
                </div>
            </div>
        </div>
    </div>

    <template id="goal-item-template">
        <li class="flex flex-col">
            <div class="goal-period w-full divider mb-3">
                <span class="goal-date"></span>
            </div>
            <div class="goal-content flex justify-between hover:bg-gray-50 active:bg-gray-100">
                <button type="button" class="w-full p-1 text-left goal-item-btn">
                    <span class="goal-result badge badge-soft w-15"></span>
                    <span class="goal-task"></span>
                </button>
                <button class="goal-delete-btn"><i data-lucide="eraser"
                        class="text-sm text-gray-400 hover:text-gray-900 pr-1"></i></button>
            </div>
        </li>
    </template>

    <th:block th:replace="~{fragments/script :: common-script}"></th:block>
    <script type="module">
        import { sendRequest } from '/js/apiUtil.js';
        import { toast } from '/js/uiManager.js';
        import { goalApi, GOAL_API_MESSAGES } from '/js/goalApi.js';

        const GOAL_RESULT_MESSAGES = {
            SUCCESS: "목표 달성! 다음 목표도 파이팅 해봐요✨",
            FAILED: "저장 완료. 이번의 아쉬움은 다음에 채워봐요💪"
        };

        const GOAL_RESULT_CONFIG = {
            SUCCESS: {
                label: '달성',
                badge: 'badge-success'
            },
            FAILED: {
                label: '미달성',
                badge: 'badge-error'
            },
            NONE: {
                label: '미선택',
                badge: 'badge-warning'
            }
        };

        let currentFilter = '';
        let currentGoalListPage = 0;
        let currentType = '';

        function openDrawer() {
            const container = document.getElementById('drawer-container');
            const checkbox = document.getElementById('goal-list-drawer');

            checkbox.checked = true;
            container.classList.add('drawer-open');
        }

        function closeDrawer() {
            const container = document.getElementById('drawer-container');
            const checkbox = document.getElementById('goal-list-drawer');

            container.classList.remove('drawer-open');
        }

        const buildUrl = (type, result = 'ALL', page = 0) => {
            const params = new URLSearchParams();
            params.append('type', type);

            if (result && result !== 'ALL') {
                params.append('result', result);
            }

            params.append('page', page);

            return `/goals?${params.toString()}`;
        };

        const renderGoalList = async (type, url) => {
            try {
                const apiResponse = await sendRequest(url, 'GET');
                const template = document.getElementById('goal-item-template');
                const fragment = document.createDocumentFragment();
                const container = document.getElementById('goal-list-container');

                let startDate = '';
                let dueDate = '';
                const isDaily = (type === 'DAILY');
                const isLastPage = apiResponse.last;

                apiResponse.content.forEach(g => {
                    const clone = template.content.cloneNode(true);

                    if (startDate == g.period.startDate && dueDate == g.period.dueDate) {
                        clone.querySelector('.goal-period').remove();
                    } else {
                        startDate = g.period.startDate;
                        dueDate = g.period.dueDate;

                        if (isDaily) {
                            clone.querySelector('.goal-date').textContent = dueDate;

                        } else {
                            clone.querySelector('.goal-date').textContent = `${startDate} ~ ${dueDate}`;
                        }
                    }

                    clone.querySelector('.goal-result').textContent = GOAL_RESULT_CONFIG[g.result].label;
                    clone.querySelector('.goal-result').classList.add(GOAL_RESULT_CONFIG[g.result].badge);
                    clone.querySelector('.goal-task').textContent = g.task;

                    clone.querySelector('.goal-content').dataset.id = g.id;
                    clone.querySelector('.goal-content').dataset.task = g.task;
                    clone.querySelector('.goal-content').dataset.result = g.result;
                    clone.querySelector('.goal-content').dataset.resultDate = g.resultDate;

                    fragment.appendChild(clone);
                });
                container.appendChild(fragment);
                lucide.createIcons();

                if (isLastPage) {
                    document.getElementById('more-btn-container').classList.add('hidden');
                } else {
                    document.getElementById('more-btn-container').classList.remove('hidden');
                }
            } catch (error) {
                console.log(error.message);
            }
        }

        const resetGoalList = (isAppend) => {
            if (isAppend) {
                return;
            }
            const container = document.getElementById('goal-list-container');

            container.innerHTML = '';
            currentGoalListPage = 0;
        };

        const resetGoalResult = () => {
            const radios = document.querySelectorAll('input[name="result"]');

            radios.forEach(r => {
                r.checked = false;
            });

            document.querySelector('input[type="date"]').value = '';
        };

        const showGoalListDrawer = async (type, isAppend = false) => {
            currentFilter = 'ALL';
            resetGoalList(isAppend);

            const allRadio = document.querySelector('input[name="goalResultFilter"][value="ALL"]');
            allRadio.checked = true;

            const url = buildUrl(type);
            renderGoalList(type, url);
            openDrawer();
        };

        function showNextGoalListPage() {
            currentGoalListPage++;

            const url = buildUrl(currentType, currentFilter, currentGoalListPage);
            resetGoalList(true);
            renderGoalList(currentType, url);
        }

        document.getElementById('goal-more-btn').addEventListener('click', showNextGoalListPage);

        document.querySelectorAll('.goal-list-btn').forEach(button => {
            button.addEventListener('click', (e) => {
                currentType = e.currentTarget.dataset.type;
                showGoalListDrawer(currentType);
            });
        });

        document.getElementById('goal-list-drawer').addEventListener('change', (e) => {
            if (!e.target.checked) {
                closeDrawer();
            }
        });

        document.querySelectorAll('#goal-filter-container input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', async (e) => {
                currentFilter = e.target.value;
                resetGoalList();

                const url = buildUrl(currentType, currentFilter, currentGoalListPage);
                renderGoalList(currentType, url);
            });
        });

        const handleDelete = async (id, row) => {
            if (!confirm('해당 목표를 정말 삭제하시겠습니까?')) return;

            const isSuccess = await goalApi.delete(id);

            if (isSuccess) {
                toast.success(GOAL_API_MESSAGES.DELETE);
                row.remove();
            } else {
                toast.error(GOAL_API_MESSAGES.ERROR);
            }
        }

        document.addEventListener('click', (e) => {
            const drawer = document.getElementById('drawer-result');
            const row = e.target.closest('.goal-content');

            if (!row) return;

            const deleteBtn = e.target.closest('.goal-delete-btn');
            const goalId = row.dataset.id;

            if (deleteBtn) {
                handleDelete(goalId, row);
            }

            const btn = e.target.closest('.goal-item-btn');

            document.querySelectorAll('.goal-content.bg-gray-100').forEach(btn => {
                btn.classList.remove('bg-gray-100');
            });

            const task = row.dataset.task;
            const result = row.dataset.result;
            const resultDate = row.dataset.resultDate;
            const resultRadio = document.querySelector(`input[name="result"][value="${result}"]`);

            drawer.querySelector('span').textContent = task;
            drawer.classList.remove('hidden');
            row.classList.add('bg-gray-100');

            drawer.dataset.id = goalId;
            drawer.dataset.result = result;
            drawer.dataset.resultDate = resultDate;

            resetGoalResult();

            const hasResult = (result !== 'NONE');
            if (hasResult) {
                resultRadio.checked = true;
                document.querySelector('input[type="date"]').value = resultDate;
            }
        });

        document.querySelectorAll('#result-radio-div input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', async (e) => {
                const drawer = document.getElementById('drawer-result');
                const goalId = drawer.dataset.id;

                const savedResult = drawer.dataset.result;
                const savedResultDate = drawer.dataset.resultDate;

                const selectedResult = e.target.value;

                if (savedResult === selectedResult) {
                    return;
                }

                const updateResultData = {
                    result: selectedResult
                };

                try {
                    const apiResponse = await sendRequest(`/goals/${goalId}/result`, 'PATCH', updateResultData);
                    toast.success(GOAL_RESULT_MESSAGES[apiResponse.result]);
                } catch (error) {
                    toast.error(error.message);
                }
            });
        });
    </script>
</body>

</html>
