<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">

<head th:replace="~{fragments/head :: head-config('대시보드 | goalmate', ~{ :: dashboard-head})}">
    <th:block th:fragment="dashboard-head">
        <link rel="stylesheet" href="https://unpkg.com/cal-heatmap/dist/cal-heatmap.css">
        <link th:href="@{/css/dashboard.css}" href="../css/dashboard.css" rel="stylesheet">

        <script src="https://d3js.org/d3.v7.min.js"></script>
        <script src="https://unpkg.com/cal-heatmap/dist/cal-heatmap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </th:block>
</head>

<body>
    <div class="flex flex-col h-screen">
        <header th:replace="~{fragments/nav :: topNav(false)}"></header>
        <div class="flex flex-1 overflow-hidden">
            <aside th:replace="~{fragments/nav :: leftNav}" class="overflow-y-auto"></aside>

            <div class="flex-1 overflow-y-auto">
                <div class="flex flex-row gap-3 w-full p-10 pb-3 min-w-0">
                    <div class="card flex-none w-fit bg-base-100 shadow-sm border border-base-200 overflow-hidden">
                        <div class="card-body p-5">
                            <div class="flex justify-between items-center">
                                <h2 class="card-title mb-2">📅 오늘의 일간 목표</h2>
                                <span class="badge badge-outline justify-center"
                                    th:text="|${#lists.size(dailyGoals)} / 3|"></span>
                            </div>
                            <div class="streak bg-base-200">
                                🔥 연속 [[${streak.currentStreak}]]일째 목표 달성 중 🔥
                            </div>
                            <div>
                                <ul class="menu w-full bg-base-200 rounded-box gap-1">
                                    <li th:if="${#lists.isEmpty(dailyGoals)}">등록된 일간 목표가 없어요!</li>
                                    <li th:unless="${#lists.isEmpty(dailyGoals)}" th:each="goal : ${dailyGoals}">
                                        <label class="goal-item-btn justify-start font-normal" th:data-id="${goal.id}"
                                            th:data-result="${goal.result}">
                                            <input type="checkbox" class="checkbox checkbox-sm"
                                                th:checked="${goal.result.name() == 'SUCCESS'}">
                                            <span th:text="${goal.task}">목표 제목</span>
                                        </label>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    <div class="card flex-none w-fit bg-base-100 shadow-sm border border-base-200 overflow-hidden">
                        <div class="card-body p-5">
                            <h2 class="card-title mb-2">이번달 목표 달성률</h2>
                            <div class="grid grid-cols-2">
                                <div th:each="s : ${successRateStat}">
                                    <div class="flex flex-col text-center m-2 p-2 bg-base-200 rounded-box">
                                        <div class="mb-1" th:text="${s.type.name()}"></div>
                                        <div class="radial-progress text-primary"
                                            th:style="|--value:${s.successRate}; --size:8rem; --thickness: 0.5rem;|"
                                            th:aria-valuenow="${s.successRate}" role="progressbar"
                                            th:utext="|${s.successRate}%<br>${s.successCount} / ${s.totalCount}|">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card flex-1 min-w-0 bg-base-100 shadow-sm border border-base-200 overflow-hidden">
                        <div class="card-body p-5 flex-col h-full">
                            <h2 class="card-title mb-2">지난달 감정별 목표 달성률</h2>
                            <div class="flex-1 min-h-0 w-full relative">
                                <canvas id="emotion-chart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="p-10 pt-0">
                    <div class="card bg-base-100 shadow-sm border border-base-200 overflow-hidden">
                        <div class=" card-body p-7 flex flex-row items-start gap-8 overflow-x-auto">
                            <div class="flex flex-col w-fit">
                                <h2 class="card-title mb-2">하루 기록</h2>
                                <div class="flex justify-between item-center">
                                    <div class="badge badge-neutral badge-dash mb-2">
                                        <span id="year-span" class="tracking-[0.1em]"></span>
                                    </div>
                                    <div id="year-btn-container">
                                        <button id="year-left-btn" class="btn btn-ghost p-0">
                                            <i data-lucide="square-chevron-left" class="w-6 h-6"></i>
                                        </button>
                                        <button id="year-right-btn" class="btn btn-ghost p-0">
                                            <i data-lucide="square-chevron-right" class="w-6 h-6"></i>
                                        </button>
                                    </div>
                                </div>
                                <div id="cal-heatmap"></div>
                            </div>
                            <div id="daily-record-container" class="flex-1 gap-3">
                                <div>
                                    <form>
                                        <div class="badge badge-neutral badge-dash">
                                            <i data-lucide="notebook-text" class="w-4 h-4"></i>
                                            <span id="record-date-span"></span>
                                        </div>
                                        <div id="emotion-container" class="pb-2">
                                            <fieldset class="fieldset flex rounded-box border p-2 border-base-300">
                                                <legend class="fieldset-legend">감정 선택</legend>
                                                <div class="flex justify-center w-full gap-2">
                                                    <span class="tooltip emotion-tooltip" th:each="emo : ${emotions}"
                                                        th:data-tip="${emo.description}">
                                                        <input type="radio" th:id="|emo-${emo.name()}|"
                                                            name="selectedEmotion" th:value="${emo.name()}">
                                                        <label th:for="|emo-${emo.name()}|"
                                                            class="emotion-label btn btn-circle btn-sm text-lg">
                                                            <span class="emotion-icon"
                                                                th:data-emotion="${emo.name()}"></span>
                                                        </label>
                                                    </span>
                                                </div>
                                            </fieldset>
                                        </div>
                                        <div>
                                            <div class="relative">
                                                <textarea id="record-content"
                                                    class="textarea w-full mb-2 resize-y overflow-hidden pb-8"
                                                    maxlength="50" placeholder="오늘 하루는 어땠나요?"></textarea>
                                                <div
                                                    class="absolute bottom-2 right-3 text-xs mb-2 text-base-content/50">
                                                    <span id="char-count">0</span> / 50
                                                </div>
                                            </div>
                                            <div class="flex gap-2 justify-end">
                                                <span id="updated-at-text"></span>
                                                <button type="button" id="delete-btn" class="btn rounded-full hidden">삭제
                                                </button>
                                                <button type="button" id="save-btn"
                                                    class="btn btn-outline btn-primary rounded-full">추가
                                                </button>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/script :: common-script}"></th:block>
    <script type="module">
        import { sendRequest } from '/js/apiUtil.js';
        import { toast } from '/js/uiManager.js';

        const EmotionIcon = {
            PROUD: "😎",
            EXCITED: "😆",
            GRATEFUL: "🥰",
            NEUTRAL: "😐",
            ANXIOUS: "😰",
            TIRED: "🫠",
            FRUSTRATED: "😖",
            SAD: "😭"
        };
        const responseMessage = {
            dailyRecord: {
                add: "기록을 저장했습니다!",
                update: "기록을 수정했습니다!",
                delete: "기록을 삭제했습니다!"
            },
        };

        const cal = new CalHeatmap();

        let heatmapData = {};
        let currentYear = new Date().getFullYear();

        const showEmotionIcon = () => {
            const container = document.getElementById('emotion-container');
            const emotionSpan = container.querySelectorAll('.emotion-icon');

            emotionSpan.forEach(span => {
                const emoKey = span.dataset.emotion;
                span.innerText = EmotionIcon[emoKey];
            })
        };

        const countChar = () => {
            const input = document.getElementById('record-content');
            const countSpan = document.getElementById('char-count');

            input.addEventListener('input', () => {
                countSpan.innerText = input.value.length;
            });
        }

        const heatmapConfig = (year) => {
            const heatmapArray = Object.values(heatmapData);

            cal.paint({
                itemSelector: "#cal-heatmap",
                domain: {
                    type: 'month',
                    label: {
                        text: 'MMM',
                        position: 'bottom',
                    },
                    dynamicDimension: false
                },
                scale: {
                    color: {
                        type: 'threshold',
                        range: ['#ebedf0', '#657899'],
                        domain: [1]
                    }
                },
                subDomain: {
                    type: 'ghDay',
                    radius: 2,
                    width: 13,
                    height: 13,
                    gutter: 3
                },
                date: {
                    start: new Date(`${year}-01-01`),
                    highlight: [new Date()]
                },
                data: {
                    source: heatmapArray,
                    x: 'date',
                    y: 'value'
                },
                range: 12
            });
        }

        const formatDateTime = (dateTime) => {
            const date = new Date(dateTime);

            const formatter = new Intl.DateTimeFormat('ko-KR', {
                year: '2-digit',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });

            return formatter.format(date);
        }

        const changeUpdatedAt = (createdAt, updatedAt) => {
            const updateSpan = document.getElementById('updated-at-text');
            const isModified = createdAt && updatedAt && createdAt !== updatedAt;

            updateSpan.classList.toggle('hidden', !isModified);

            if (isModified) {
                const formattedUpdatedAt = formatDateTime(updatedAt);
                updateSpan.innerText = `${formattedUpdatedAt} 수정됨`;
            }
        }

        const getRecordDetail = async (recordDate) => {
            const id = heatmapData[recordDate]?.id;
            if (!id) {
                changeUpdatedAt(null, null);
                return;
            }
            const response = await sendRequest(`/api/daily-records/${id}`, 'GET');

            changeRecordForm(response.recordDate);
            showRecordDetail(response);
        };

        const loadHeatmap = async (year) => {
            const response = await sendRequest(`/api/daily-records?year=${year}`, 'GET');
            document.getElementById('year-span').innerText = `${year}년`;

            const heatmapArray = response.map(item => ({
                id: item.id,
                date: item.recordDate,
                value: 1
            }));

            heatmapData = Object.fromEntries(heatmapArray.map(item => [item.date, item]));
            heatmapConfig(year);
        }

        const saveDailyRecord = async () => {
            const selectedDate = document.getElementById('daily-record-container').dataset.recordDate;
            const recordId = heatmapData[selectedDate]?.id;

            const saveDailyRecordData = {
                emotion: document.querySelector('input[name="selectedEmotion"]:checked')?.value,
                content: document.getElementById('record-content').value,
            };

            try {
                if (!recordId) {
                    saveDailyRecordData.recordDate = selectedDate;
                }

                const method = recordId ? 'PUT' : 'POST';
                const url = recordId ? `/api/daily-records/${recordId}` : '/api/daily-records'

                const response = await sendRequest(url, method, saveDailyRecordData);
                if (response.id) {
                    heatmapData[selectedDate] = {
                        id: response.id,
                        date: selectedDate,
                        value: 1
                    };
                }

                heatmapConfig(currentYear);
                changeRecordForm(selectedDate);

                toast.success(recordId ? responseMessage.dailyRecord.update : responseMessage.dailyRecord.add);
            } catch (error) {
                toast.error(error.message);
            }
        };

        const showRecordDetail = (data) => {
            const emotionValue = data.emotion;
            const targetRadio = document.querySelector(`input[name="selectedEmotion"][value="${emotionValue}"]`);
            const content = data.content;
            const textInput = document.getElementById('record-content');

            targetRadio.checked = true;
            textInput.value = content;

            changeUpdatedAt(data.createdAt, data.updatedAt);
        }

        const changeRecordForm = (date) => {
            const isUpdate = !!heatmapData[date]?.id;

            document.getElementById('daily-record-container').dataset.recordDate = date;
            document.getElementById('record-date-span').innerText = date;

            document.getElementById('delete-btn').classList.toggle('hidden', !isUpdate);
            document.getElementById('save-btn').textContent = isUpdate ? '수정' : '추가';
        }

        const changeYear = async (btnType) => {
            const thisYear = new Date().getFullYear();

            if (btnType === 'LEFT') currentYear -= 1;
            else if (btnType === 'RIGHT') {
                if (currentYear >= thisYear) {
                    toast.error(`${thisYear + 1}년은 아직 확인할 수 없어요!`)
                    return;
                }
                currentYear += 1;
            }

            await loadHeatmap(currentYear);
        }

        const deleteRecord = async () => {
            const selectedDate = document.getElementById('daily-record-container').dataset.recordDate;
            const recordId = heatmapData[selectedDate]?.id;

            if (!recordId) return;

            if (!confirm(`해당 날짜(${selectedDate})의 기록을 정말 삭제하시겠습니까?`)) return;

            try {
                await sendRequest(`/api/daily-records/${recordId}`, 'DELETE');
                toast.success(responseMessage.dailyRecord.delete);

                document.querySelector('form').reset();
                delete heatmapData[selectedDate];
                heatmapConfig(currentYear);
            } catch (error) {
                toast.error(error.message);
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            const today = new Date().toLocaleDateString('en-CA');
            changeRecordForm(today);

            loadHeatmap(currentYear);

            cal.on('click', (event, timestamp, value) => {
                document.querySelector('form').reset();

                const selectedDate = new Date(timestamp).toLocaleDateString('en-CA');
                changeRecordForm(selectedDate);
                getRecordDetail(selectedDate);
            })

            showEmotionIcon();
            countChar();
        });

        document.getElementById('save-btn').addEventListener('click', saveDailyRecord);
        document.getElementById('year-left-btn').addEventListener('click', () => changeYear('LEFT'));
        document.getElementById('year-right-btn').addEventListener('click', () => changeYear('RIGHT'));
        document.getElementById('delete-btn').addEventListener('click', deleteRecord);

    </script>

</body>
<script th:inline="javascript">
    const EmotionIcon = {
        PROUD: "😎",
        EXCITED: "😆",
        GRATEFUL: "🥰",
        NEUTRAL: "😐",
        ANXIOUS: "😰",
        TIRED: "🫠",
        FRUSTRATED: "😖",
        SAD: "😭",
        UNRECORDED: "❔"
    };
    const emotionChart = document.getElementById('emotion-chart');

    const emotionStatData = [
        /*[# th:each="e : ${emotionStat}"]*/
        {
            name: /*[[${e.name}]]*/ '이름',
            description: /*[[${e.description}]]*/ '설명',
            recordedCount: /*[[${e.recordedCount}]]*/ '횟수',
            successRate: /*[[${e.successRate}]]*/ '달성률'
        },
        /*[/]*/
    ];

    const successRateStatData = [
        /*[# th:each="s : ${successRateStat}"]*/
        {
            type: /*[[${s.type}]]*/ '구분',
            successRate: /*[[${s.successRate}]]*/ '달성률',
            successCount: /*[[${s.successCount}]]*/ '달성목표수',
            totalCount: /*[[${s.totalCount}]]*/ '총목표수'
        },
        /*[/]*/
    ];

    const emotionChartLabels = emotionStatData.map(e => {
        return `${EmotionIcon[e.name]} ${e.description}`;
    });

    const emotionCounts = emotionStatData.map(e => {
        return e.recordedCount;
    });

    const emotionSuccessRate = emotionStatData.map(e => {
        return e.successRate;
    });

    const successRate = successRateStatData.map(s => {
        return s.successRate
    });

    new Chart(emotionChart, {
        data: {
            labels: emotionChartLabels,
            datasets: [
                {
                    type: 'bar',
                    label: '횟수',
                    data: emotionCounts,
                    backgroundColor: 'rgba(54, 162, 235, 0.5)',
                    yAxisID: 'y',
                },
                {
                    type: 'line',
                    label: '목표 달성률 (%)',
                    data: emotionSuccessRate,
                    borderColor: 'rgb(255, 99, 132)',
                    backgroundColor: 'rgb(255, 99, 132)',
                    borderWidth: 3,
                    fill: false,
                    yAxisID: 'y1',
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    type: 'linear',
                    display: true,
                    position: 'left',
                    beginAtZero: true,
                    title: { display: true, text: '기록 횟수' }
                },
                y1: {
                    type: 'linear',
                    display: true,
                    position: 'right',
                    min: 0,
                    max: 100,
                    grid: { drawOnChartArea: false },
                    title: { display: true, text: '달성률 (%)' }
                }
            }
        }
    });
</script>

</html>
